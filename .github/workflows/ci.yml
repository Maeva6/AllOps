name: AllOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1 : Tests ──────────────────────────────────────────────────────────
  tests:
    name: Tests automatiques
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests pytest
        run: |
          pytest tests/ -v --tb=short
        env:
          FLASK_ENV: testing
          SECRET_KEY: cle-de-test-github-actions
          DATABASE_URL: 'sqlite:///:memory:'

      - name: Rapport de couverture
        run: |
          pip install pytest-cov
          pytest tests/ --cov=app --cov-report=term-missing
        env:
          FLASK_ENV: testing
          SECRET_KEY: cle-de-test-github-actions
          DATABASE_URL: 'sqlite:///:memory:'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  # ── Job 2 : Qualité du code ────────────────────────────────────────────────
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    needs: tests          # S'exécute seulement si les tests passent

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les outils
        run: |
          pip install flake8

      - name: Vérifier la syntaxe Python (flake8)
        run: |
          # Erreurs critiques seulement (syntaxe, imports non définis)
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source

  # ── Job 3 : Migrations DB ──────────────────────────────────────────────────
  migrations:
    name: Vérification des migrations
    runs-on: ubuntu-latest
    needs: tests          # S'exécute seulement si les tests passent

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Appliquer les migrations sur une base neuve
        run: flask db upgrade
        env:
          FLASK_APP: run.py
          SECRET_KEY: cle-de-test-github-actions
          DATABASE_URL: 'sqlite:////tmp/ci_migrations.db'

      - name: Vérifier qu'aucun modèle n'a été modifié sans migration
        run: flask db check
        env:
          FLASK_APP: run.py
          SECRET_KEY: cle-de-test-github-actions
          DATABASE_URL: 'sqlite:////tmp/ci_migrations.db'

  # ── Job 4 : Build Docker ───────────────────────────────────────────────────
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests          # S'exécute seulement si les tests passent

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: |
          docker build -t allops:latest .

      - name: Vérifier que le conteneur démarre
        run: |
          docker run -d \
            --name allops-test \
            -e SECRET_KEY=cle-test \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            -p 5000:5000 \
            allops:latest

          # Attendre que Flask démarre
          sleep 5

          # Vérifier que l'app répond
          curl -f http://localhost:5000 || exit 1

          # Arrêter le conteneur
          docker stop allops-test