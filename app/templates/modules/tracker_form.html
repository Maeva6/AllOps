{% extends "base.html" %}
{% block breadcrumb %}
  {{ "Modifier" if cert else "Ajouter" }} une certification
{% endblock %}

{% block content %}

<div class="flex items-center gap-3 mb-4">
  <a href="{{ url_for('tracker.index') }}" class="btn btn-secondary btn-sm">
    <i data-lucide="arrow-left"></i>
    Retour
  </a>
  <h1 style="font-size:18px;font-weight:600;margin:0">
    {{ "Modifier" if cert else "Ajouter" }} une certification
  </h1>
</div>

<div style="max-width:680px;">
  <div class="card">
    <div class="card-body">
      <form method="POST">

        <div class="form-group">
          <label class="form-label">Nom de la certification *</label>
          <input type="text" name="nom" class="form-control"
                 style="font-size:15px"
                 placeholder="AWS Certified Cloud Practitioner"
                 value="{{ cert.nom if cert else '' }}" required>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-group">
            <label class="form-label">Organisme *</label>
            <input type="text" name="organisme" class="form-control"
                   placeholder="AWS, Docker, Linux Foundation…"
                   value="{{ cert.organisme if cert else '' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Catégorie *</label>
            <select name="categorie" class="form-control">
              {% for cat in ['Cloud','DevOps','Sécurité','Linux','Réseau',
                             'Python','Docker','Kubernetes','CI/CD',
                             'Langues','Autre'] %}
                <option {% if cert and cert.categorie==cat %}selected{% endif %}>
                  {{ cat }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-group">
            <label class="form-label">Statut</label>
            <select name="statut" class="form-control">
              {% for s in ['A faire','En cours','Validée'] %}
                <option {% if cert and cert.statut==s %}selected{% endif %}>
                  {{ s }}
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Deadline (optionnel)</label>
            <input type="date" name="deadline" class="form-control"
                   value="{{ cert.deadline.strftime('%Y-%m-%d')
                            if cert and cert.deadline else '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            Niveau actuel :
            <span id="valNiveau" style="color:var(--accent);font-weight:600">
              {{ cert.niveau if cert else 1 }}
            </span> / 5
          </label>
          <input type="range" name="niveau" min="1" max="5" step="1"
                 value="{{ cert.niveau if cert else 1 }}"
                 oninput="document.getElementById('valNiveau').textContent=this.value">
          <div class="flex justify-between mt-1"
               style="font-size:11px;color:var(--text-muted)">
            <span>1 J'ignore</span><span>2 Découvre</span>
            <span>3 Sais faire</span><span>4 Maîtrise</span><span>5 Expert</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            Niveau visé :
            <span id="valNiveauVise"
                  style="color:var(--success);font-weight:600">
              {{ cert.niveau_vise if cert else 3 }}
            </span> / 5
          </label>
          <input type="range" name="niveau_vise" min="1" max="5" step="1"
                 value="{{ cert.niveau_vise if cert else 3 }}"
                 oninput="document.getElementById('valNiveauVise').textContent=this.value"
                 style="accent-color:var(--success)">
        </div>

        <div class="form-group">
          <label class="form-label">Notes / Prérequis</label>
          <textarea name="notes" class="form-control" rows="3"
                    placeholder="Prérequis, liens utiles, ressources…"
                    >{{- cert.notes if cert else '' -}}</textarea>
        </div>

        <div class="form-group">
          <label class="form-switch">
            <input type="checkbox" name="gratuite"
                   {% if cert and cert.gratuite %}checked{% endif %}>
            <span class="form-switch-label">Certification gratuite</span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="flex gap-2 justify-end">
          <a href="{{ url_for('tracker.index') }}"
             class="btn btn-secondary">Annuler</a>
          <button type="submit" class="btn btn-primary">
            <i data-lucide="{{ 'save' if cert else 'plus' }}"></i>
            {{ "Enregistrer" if cert else "Ajouter" }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
