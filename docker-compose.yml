# version: '3.9'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./instance:/app/instance
      - /home/maeva:/home/maeva
      - /mnt/c/Users/gaps6:/mnt/c/Users/gaps6
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
    restart: unless-stopped
